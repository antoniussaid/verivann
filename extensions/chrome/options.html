<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Verivann - settings</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0a0a0d; color: #e9e7e0; min-height: 100vh; padding: 8vh 24px;
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 13px;
    display: flex; justify-content: center;
  }
  main { width: min(460px, 100%); }
  .brand { letter-spacing: .3em; font-size: 12px; color: #cbcac4; }
  label { display: block; margin-top: 22px; color: #8f8d95; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  input, select {
    width: 100%; margin-top: 8px; background: #111116; color: #e9e7e0; border: 1px solid #26262c;
    border-radius: 10px; padding: 11px 13px; font: inherit; font-size: 12px; outline: none;
  }
  input:focus, select:focus { border-color: #6a6a72; }
  .note { margin-top: 8px; color: #55545c; font-size: 10.5px; line-height: 1.6; }
  button {
    margin-top: 26px; background: #e9e7e0; color: #0a0a0d; border: none; border-radius: 100px;
    padding: 11px 28px; font: inherit; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; cursor: pointer;
  }
  .saved { margin-left: 14px; color: #8f8d95; font-size: 11px; opacity: 0; transition: opacity .3s; }
  .saved.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <div class="brand">VERIVANN - SETTINGS</div>

  <label for="endpoint">Inbox endpoint</label>
  <input id="endpoint" type="text" placeholder="http://127.0.0.1:8130" />
  <div class="note">Your own Verivann server. Nothing is ever sent anywhere else.</div>

  <label for="token">Token</label>
  <input id="token" type="text" placeholder="(only needed when serving on the LAN)" />
  <div class="note">Printed by <code>verivann serve --lan</code>. Leave empty for a local inbox.</div>

  <label for="lens">Default lens</label>
  <select id="lens">
    <option value="digest">digest - balanced</option>
    <option value="wisdom">wisdom - insights</option>
    <option value="critique">critique - weak points</option>
    <option value="study">study - key concepts</option>
    <option value="actions">actions - next steps</option>
  </select>

  <div><button id="save">Save</button><span class="saved" id="saved">saved</span></div>
</main>
<script type="module" src="options.js"></script>
</body>
</html>
