name: Publish to PyPI

# Publishes on a GitHub Release via PyPI Trusted Publishing (OIDC) — no API token
# is stored anywhere. Cut a release on GitHub and this builds and uploads verivann.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token PyPI trusts — this is what replaces an API token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
